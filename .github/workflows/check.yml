name: Verificar rama

# Compila y prueba las ramas de trabajo sin publicar la app (la versión oficial solo sale de main).
# También abre la app en un Android virtual y publica capturas en el release "diagnostico".
on:
  push:
    branches-ignore: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK (desarrollador)
        run: |
          set -o pipefail
          gradle :app:assembleDevRelease --no-daemon --stacktrace 2>&1 | tee build.log || {
            grep -a -A5 -E "^e: |What went wrong" build.log | grep -av "^--" | head -16 | while IFS= read -r l; do echo "::error::${l:0:400}"; done
            exit 1
          }
          mkdir -p dist
          cp app/build/outputs/apk/dev/release/app-dev-release.apk dist/ColorFlowDev.apk

      - name: Instalar kotlinc (pruebas en la JVM)
        run: |
          curl -sSL -o kc.zip https://github.com/JetBrains/kotlin/releases/download/v1.9.24/kotlin-compiler-1.9.24.zip
          unzip -q kc.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/kotlinc/bin" >> "$GITHUB_PATH"

      - name: Pruebas del motor y del multijugador
        run: tools/run_tests.sh quick | tee motor.log; grep -q "TODO OK" motor.log

      - name: Pruebas de la Aventura (bot con daño y recorrido en modo dios)
        run: |
          tools/run_adv_tests.sh real 640 full | tee adv.log; grep -q "TODO OK" adv.log
          tools/run_adv_tests.sh god 640 rooms | tee rooms.log; grep -q "TODO OK" rooms.log

      - name: Guardar APK de prueba
        uses: actions/upload-artifact@v4
        with:
          name: ColorFlow-apk
          path: dist/

  smoke:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ColorFlow-apk

      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Probar la app en un Android virtual
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          ram-size: 4096M
          heap-size: 512M
          script: bash ci/smoke.sh

      - name: Publicar informe de la prueba
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci/publicar_diagnostico.sh

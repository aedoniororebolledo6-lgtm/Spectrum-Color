name: Variantes

# Busca, para niveles sueltos, una variante (Levels.salts) que la búsqueda de factibilidad complete.
# Se lanza a mano: niveles = "21,22,41", desde = 8, hasta = 24. Un trabajo por nivel, todos a la vez.
on:
  workflow_dispatch:
    inputs:
      niveles:
        description: "Niveles separados por comas"
        required: true
      desde:
        description: "Primera variante a probar"
        default: "8"
      hasta:
        description: "Última variante a probar"
        default: "24"

jobs:
  nivel:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        level: ${{ fromJSON(format('[{0}]', github.event.inputs.niveles)) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar kotlinc
        run: |
          curl -sSL -o kc.zip https://github.com/JetBrains/kotlin/releases/download/v1.9.24/kotlin-compiler-1.9.24.zip
          unzip -q kc.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/kotlinc/bin" >> "$GITHUB_PATH"

      - name: Compilar las pruebas
        run: |
          SRC=app/src/main/java/com/nioro/spectrumcolor
          kotlinc "$SRC/Engine.kt" "$SRC/Kit.kt" "$SRC/Net.kt" "$SRC/Match.kt" tools/SimTest.kt -include-runtime -d tests.jar 2>&1 | grep -v "^warning" || true

      - name: Buscar variante
        run: |
          # cada variante en un hilo propio: se reparten las del rango entre los núcleos
          L=${{ matrix.level }}
          SALTS=$(seq ${{ github.event.inputs.desde }} ${{ github.event.inputs.hasta }} | tr '\n' ' ')
          SALT_FROM=${{ github.event.inputs.desde }} DELAYS=0,4,8 java -Xmx12g -cp tests.jar com.nioro.spectrumcolor.SimTestKt salt ${{ github.event.inputs.hasta }} $L | tee out.txt
          {
            echo "### Nivel $L"
            echo '```'
            grep -E "variante" out.txt | sort -k4 -n
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

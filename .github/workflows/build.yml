name: Compilar APK

on:
  push:
    # solo main publica; las ramas de trabajo se verifican con check.yml ("Verificar rama")
    branches: ["main"]
    # la documentación y las herramientas no cambian la app: no publicar una "actualización" vacía
    paths-ignore: ["**.md", "tools/**", "ci/**"]
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: build-${{ github.event_name == 'issues' && 'publicar' || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Los avisos "NIVELES …" los crea el editor de la app (versión de desarrollador): solo vale el dueño del repositorio.
    if: github.event_name != 'issues' || (github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, 'NIVELES'))
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Aplicar niveles publicados desde el editor
        id: niveles
        if: github.event_name == 'issues'
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python3 tools/apply_levels.py
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add app/src/main/assets/levels
          if git diff --cached --quiet; then
            echo "Los niveles ya estaban publicados: sin cambios"
          else
            git commit -m "Niveles publicados desde el editor (aviso #${{ github.event.issue.number }})"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK firmado
        id: gradle
        run: |
          set -o pipefail
          gradle :app:assembleNormalRelease :app:assembleDevRelease --no-daemon --stacktrace 2>&1 | tee build.log || {
            grep -a -A5 -E "^e: |What went wrong" build.log | grep -av "^--" | head -16 | while IFS= read -r l; do echo "::error::${l:0:400}"; done
            exit 1
          }

      - name: Publicar errores de compilación
        if: failure() && steps.gradle.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -a -E "^e: |error:|What went wrong|FAILED|Execution failed" -A4 build.log | head -c 100000 > err.txt || true
          [ -s err.txt ] || tail -c 20000 build.log > err.txt
          gh release delete build-error --yes --cleanup-tag || true
          gh release create build-error --title "Error de compilación" --notes-file err.txt --prerelease

      - name: Limpiar aviso de error anterior
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete build-error --yes --cleanup-tag || true

      - name: Preparar APK y código QR
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/normal/release/app-normal-release.apk dist/ColorFlow.apk
          cp app/build/outputs/apk/dev/release/app-dev-release.apk dist/ColorFlowDev.apk
          # copias con el nombre anterior para que las apps ya instaladas puedan actualizarse
          cp dist/ColorFlow.apk dist/SpectrumColor.apk
          cp dist/ColorFlowDev.apk dist/SpectrumColorDev.apk
          sudo apt-get update -y
          sudo apt-get install -y qrencode
          URL="https://github.com/${{ github.repository }}/releases/latest/download/ColorFlow.apk"
          qrencode -o dist/qr.png -s 14 -m 3 "$URL"
          URL_DEV="https://github.com/${{ github.repository }}/releases/latest/download/ColorFlowDev.apk"
          qrencode -o dist/qr_dev.png -s 14 -m 3 "$URL_DEV"
          echo "Enlace de descarga: $URL"

      - name: Publicar versión (enlace fijo, solo rama main)
        if: github.ref == 'refs/heads/main' || github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest dist/ColorFlow.apk dist/qr.png dist/ColorFlowDev.apk dist/qr_dev.png dist/SpectrumColor.apk dist/SpectrumColorDev.apk \
            --target "$(git rev-parse HEAD)" \
            --title "Color Flow (última versión)" \
            --notes "Escanea el QR o abre ColorFlow.apk desde el celular para instalar. Compilación #${{ github.run_number }}."

      - name: Resumen
        if: github.ref == 'refs/heads/main' || github.event_name == 'issues'
        run: |
          {
            echo "## Color Flow listo"
            echo ""
            echo "Descarga: https://github.com/${{ github.repository }}/releases/latest/download/ColorFlow.apk"
            echo ""
            echo "QR: https://github.com/${{ github.repository }}/releases/latest/download/qr.png"
            echo ""
            echo "Desarrollador: https://github.com/${{ github.repository }}/releases/latest/download/ColorFlowDev.apk"
            echo "QR desarrollador: https://github.com/${{ github.repository }}/releases/latest/download/qr_dev.png"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ColorFlow-apk
          path: dist/

      - name: Avisar en el issue
        if: github.event_name == 'issues' && always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "Niveles publicados (${{ steps.niveles.outputs.levels }}). Compilación #${{ github.run_number }} lista: ya están en el juego oficial."
          else
            gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "No se pudieron publicar los niveles. Revisa la ejecución #${{ github.run_number }}."
          fi
          gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }}

  # "Ojos": abre la versión de desarrollador en un Android virtual, recorre las pantallas con atajos
  # y publica capturas + report.txt en el release "diagnostico" (ver tools/capturas.sh).
  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ColorFlow-apk

      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Probar la app en un Android virtual
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          ram-size: 4096M
          heap-size: 512M
          script: bash ci/smoke.sh

      - name: Publicar informe de la prueba
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci/publicar_diagnostico.sh

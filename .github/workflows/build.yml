name: Compilar APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK firmado
        run: gradle :app:assembleNormalRelease :app:assembleDevRelease --no-daemon --stacktrace

      - name: Preparar APK y código QR
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/normal/release/app-normal-release.apk dist/SpectrumColor.apk
          cp app/build/outputs/apk/dev/release/app-dev-release.apk dist/SpectrumColorDev.apk
          sudo apt-get update -y
          sudo apt-get install -y qrencode
          URL="https://github.com/${{ github.repository }}/releases/latest/download/SpectrumColor.apk"
          qrencode -o dist/qr.png -s 14 -m 3 "$URL"
          URL_DEV="https://github.com/${{ github.repository }}/releases/latest/download/SpectrumColorDev.apk"
          qrencode -o dist/qr_dev.png -s 14 -m 3 "$URL_DEV"
          echo "Enlace de descarga: $URL"

      - name: Publicar versión (enlace fijo, solo rama main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest dist/SpectrumColor.apk dist/qr.png dist/SpectrumColorDev.apk dist/qr_dev.png \
            --target "${{ github.sha }}" \
            --title "Spectrum Color (última versión)" \
            --notes "Escanea el QR o abre SpectrumColor.apk desde el celular para instalar. Compilación #${{ github.run_number }}."

      - name: Resumen
        if: github.ref == 'refs/heads/main'
        run: |
          {
            echo "## Spectrum Color listo"
            echo ""
            echo "Descarga: https://github.com/${{ github.repository }}/releases/latest/download/SpectrumColor.apk"
            echo ""
            echo "QR: https://github.com/${{ github.repository }}/releases/latest/download/qr.png"
            echo ""
            echo "Desarrollador: https://github.com/${{ github.repository }}/releases/latest/download/SpectrumColorDev.apk"
            echo "QR desarrollador: https://github.com/${{ github.repository }}/releases/latest/download/qr_dev.png"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: SpectrumColor-apk
          path: dist/

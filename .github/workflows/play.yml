name: Subir a Google Play

# Igual que build.yml pero hacia Google Play: cada cambio de la app que llega a main se compila como paquete
# de Play (.aab, versión "play": sin botón de actualizar) firmado con la llave de subida y se sube solo a
# Play Console. Necesita estos "Secrets" del repositorio (Settings → Secrets and variables → Actions):
#   UPLOAD_KEYSTORE_B64       la llave de subida (archivo .jks en base64)
#   UPLOAD_KEYSTORE_PASSWORD  su contraseña
#   PLAY_SERVICE_ACCOUNT_JSON la llave JSON de la cuenta de servicio con permiso en Play Console
# Y opcionalmente estas "Variables" (misma pantalla, pestaña Variables):
#   PLAY_TRACK  pista de Play: internal (por defecto), alpha (prueba cerrada), beta (abierta) o production
# Sin PLAY_SERVICE_ACCOUNT_JSON el paquete igual se compila y queda en el release "play" para subirlo a mano
# (la primera subida de una app nueva SIEMPRE es a mano: Google no deja crearla por la API).
on:
  push:
    branches: ["main"]
    paths-ignore: ["**.md", "tools/**", "ci/**", "docs/**"]
  workflow_dispatch:
    inputs:
      track:
        description: "Pista de Play (internal, alpha, beta, production)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: play
  cancel-in-progress: false

jobs:
  play:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.UPLOAD_KEYSTORE_B64 != '' }}
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: ¿Está la llave de subida?
        if: env.HAS_KEY != 'true'
        run: |
          echo "::error::Falta el secret UPLOAD_KEYSTORE_B64 (la llave de subida a Google Play). Ver docs/google_play.md"
          exit 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Compilar el paquete de Play (.aab)
        env:
          KEY_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          export UPLOAD_KEYSTORE="$RUNNER_TEMP/upload.jks"
          echo "$KEY_B64" | base64 -d > "$UPLOAD_KEYSTORE"
          gradle :app:bundlePlayRelease --no-daemon --stacktrace 2>&1 | tee build.log || {
            grep -a -A5 -E "^e: |What went wrong" build.log | grep -av "^--" | head -16 | while IFS= read -r l; do echo "::error::${l:0:400}"; done
            exit 1
          }
          rm -f "$UPLOAD_KEYSTORE"
          mkdir -p dist
          cp app/build/outputs/bundle/playRelease/app-play-release.aab dist/ColorFlow.aab
          printf 'Nueva versión de Color Flow (compilación #%s).\n' "${{ github.run_number }}" > dist/whatsnew-es-419
          cp dist/whatsnew-es-419 dist/whatsnew-es-ES
          printf 'New Color Flow version (build #%s).\n' "${{ github.run_number }}" > dist/whatsnew-en-US

      - name: Guardar el paquete en el release "play" (para subirlo a mano si hace falta)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete play --cleanup-tag -y || true
          gh release create play dist/ColorFlow.aab --prerelease --target "$(git rev-parse HEAD)" \
            --title "Color Flow para Google Play" \
            --notes "Paquete para Play Console (compilación #${{ github.run_number }}). Se sube solo si está la cuenta de servicio; si no, descárgalo y súbelo a mano."

      - name: Subir a Google Play
        id: subir
        if: env.HAS_PLAY == 'true'
        continue-on-error: true
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: nioro.color.flow
          releaseFiles: dist/ColorFlow.aab
          track: ${{ inputs.track || vars.PLAY_TRACK || 'internal' }}
          status: completed
          whatsNewDirectory: dist

      # Mientras la app no está publicada todavía, Play solo acepta versiones en borrador.
      - name: Subir a Google Play (como borrador)
        if: env.HAS_PLAY == 'true' && steps.subir.outcome == 'failure'
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: nioro.color.flow
          releaseFiles: dist/ColorFlow.aab
          track: ${{ inputs.track || vars.PLAY_TRACK || 'internal' }}
          status: draft
          whatsNewDirectory: dist

      - name: Resumen
        run: |
          {
            echo "## Color Flow para Google Play"
            echo "- Paquete: release **play** → ColorFlow.aab"
            if [ "$HAS_PLAY" = "true" ]; then echo "- Subido a Play Console, pista **${{ inputs.track || vars.PLAY_TRACK || 'internal' }}**"
            else echo "- Falta el secret PLAY_SERVICE_ACCOUNT_JSON: súbelo a mano desde Play Console"; fi
          } >> "$GITHUB_STEP_SUMMARY"
